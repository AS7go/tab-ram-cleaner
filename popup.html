<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: Arial, sans-serif;
      padding: 8px;
      text-align: center;
    }
    h3 {
      margin: 0 0 5px 0;
    }
    .subtitle {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
      line-height: 1.2;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #3367d6;
    }
    #tabsList {
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
      text-align: left;
      font-size: 11px;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 5px;
    }
    .tab-item {
      padding: 2px 0;
      border-bottom: 1px solid #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-item:last-child {
      border-bottom: none;
    }
    #status {
      margin-top: 8px;
      font-size: 13px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <h3>Управление RAM</h3>
  <div class="subtitle">Неактивные вкладки, готовые к выгрузке:</div>
  <div id="tabsList">Загрузка списка...</div>
  <button id="discardBtn">Выгрузить неактивные</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
