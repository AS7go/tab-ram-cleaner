<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: Arial, sans-serif;
      padding: 8px;
      text-align: center;
    }
    h3 {
      margin: 0 0 5px 0;
    }
    .subtitle {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
      line-height: 1.2;
    }
    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 6px;
      line-height: 1.3;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 8px;
    }
    button:hover:not(:disabled) {
      background-color: #3367d6;
    }
    button:disabled {
      background-color: #ccc;
      cursor: default;
    }
    #tabsList {
      margin-top: 10px;
      max-height: 220px;
      overflow-y: auto;
      text-align: left;
      font-size: 12px;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 5px;
    }
    .tab-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 2px;
      border-bottom: 1px solid #eee;
    }
    .tab-item:last-child {
      border-bottom: none;
    }
    .tab-item input[type="checkbox"] {
      flex-shrink: 0;
      cursor: pointer;
    }
    .tab-item input[type="checkbox"]:disabled {
      cursor: default;
    }
    .tab-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .tab-title.protected {
      color: #1565c0;
      font-weight: bold;
    }
    .tab-title.active {
      color: #2e7d32;
      font-weight: bold;
    }
    .tab-title.disabled {
      color: #aaa;
      text-decoration: line-through;
    }
    #status {
      margin-top: 8px;
      font-size: 13px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <h3>Управление RAM</h3>
  <div class="subtitle">Отметьте вкладки, которые <b>не нужно</b> выгружать:</div>
  <div id="tabsList">Загрузка списка...</div>
  <div class="hint">💡 Отмеченные вкладки не выгружаются и остаются в памяти</div>
  <button id="discardBtn">Выгрузить неактивные</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
